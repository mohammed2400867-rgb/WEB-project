<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flour & Flame | Account</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="Css/Login.css"></head>

<body>

    <div class="login-card">
        <div class="header">
            <h1><span id="secret-pin-login" class="secret-pin">F</span>LOUR & FLAME</h1>
            <p>Member Access</p>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="email@example.com">
            <span id="emailError" class="validation-msg"></span>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-container">
                <input type="password" id="password" placeholder="••••••••">
                <button class="toggle-btn" id="togglePass">SHOW</button>
            </div>
            <div id="strengthContainer" class="strength-bar-container" style="display: none;">
                <div id="passStrengthBar" class="strength-bar"></div>
            </div>
            <span id="passStrengthText" class="validation-msg" style="display: none;"></span>
        </div>

        <div class="form-group" id="confirmPassGroup" style="display: none;">
            <label>Confirm Password</label>
            <div class="password-container">
                <input type="password" id="confirmPassword" placeholder="••••••••">
            </div>
            <span id="confirmPassError" class="validation-msg"></span>
        </div>

        <button id="submitBtn">Sign In</button>
        <div id="status" class="message"></div>
        <div class="center-mt-15">
            <a href="#" id="toggleAuthMode" class="gold-link">Don't have an account? Sign Up</a>
        </div>
    </div>

    <!-- Admin PIN Overlay -->
    <div id="admin-pin-overlay" style="display:none;">
        <div class="pin-modal" id="pin-modal">
            <div class="pin-lock-icon">🔐</div>
            <h2 class="pin-title">Staff Access</h2>
            <p class="pin-subtitle" id="pin-subtitle">Enter your 4-digit PIN</p>
            <div class="pin-dots">
                <div class="pin-dot" id="pin-dot-0"></div>
                <div class="pin-dot" id="pin-dot-1"></div>
                <div class="pin-dot" id="pin-dot-2"></div>
                <div class="pin-dot" id="pin-dot-3"></div>
            </div>
            <p class="pin-error" id="pin-error"></p>
            <div class="pin-pad">
                <button class="pin-key" onclick="pinPress('1')">1</button>
                <button class="pin-key" onclick="pinPress('2')">2</button>
                <button class="pin-key" onclick="pinPress('3')">3</button>
                <button class="pin-key" onclick="pinPress('4')">4</button>
                <button class="pin-key" onclick="pinPress('5')">5</button>
                <button class="pin-key" onclick="pinPress('6')">6</button>
                <button class="pin-key" onclick="pinPress('7')">7</button>
                <button class="pin-key" onclick="pinPress('8')">8</button>
                <button class="pin-key" onclick="pinPress('9')">9</button>
                <button class="pin-key pin-key-cancel" onclick="closeAdminPin()">✕</button>
                <button class="pin-key" onclick="pinPress('0')">0</button>
                <button class="pin-key pin-key-del" onclick="pinDelete()">⌫</button>
            </div>
        </div>
    </div>

    <script src="Jss/Login.js"></script></body>

</html>
